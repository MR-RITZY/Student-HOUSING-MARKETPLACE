[project]
name = "stu-house-market"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MR-RITZY", email = "mrboffin01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.30.0",
    "email-validator>=2.3.0",
    "fastapi>=0.121.2",
    "passlib>=1.7.4",
    "password-validator>=1.0",
    "psycopg2>=2.9.11",
    "pydantic-settings>=2.12.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.20",
    "redis>=7.0.1",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
]

[project.scripts]
app = "src.stu_house_market.main:app"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"
